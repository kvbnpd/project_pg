  <style>
    /* General Styling */
body {
    font-family: 'Poppins', sans-serif;
    background-color: #f4f7fc;
    margin: 0;
    padding: 0;
}

/* Sidebar Styling */
.sidebar {
    background: linear-gradient(135deg, #007bff, #0056b3);
    padding: 20px;
    height: 100vh;
    color: white;
    border-radius: 10px;
}

.sidebar .card {
    background: white;
    border-radius: 10px;
    transition: 0.3s;
}

.sidebar .card:hover {
    transform: scale(1.05);
}

/* Navbar Styling */
.navbar {
    background: white;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
}

/* Sections & Tables */
.section {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
    animation: fadeInUp 0.5s ease-in-out;
}

.section h2 {
    border-left: 5px solid #007bff;
    padding-left: 15px;
    font-size: 1.4rem;
    color: #333;
    margin-bottom: 15px;
}

/* Table Styling */
table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
}

th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

th {
    background: #007bff;
    color: white;
}

td {
    background: #f8f9fa;
}

tr:hover {
    background: #eaf4ff;
    transition: 0.3s;
}

/* Status Badges */
.status-badge {
    padding: 5px 12px;
    border-radius: 15px;
    font-weight: bold;
    display: inline-block;
}

.pending {
    background: #ffc107;
    color: #333;
}

.approved {
    background: #28a745;
    color: white;
}

.rejected {
    background: #dc3545;
    color: white;
}

/* Buttons */
.btn {
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* Smooth Animation */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


        .site-name {
          font-family: 'Montserrat', sans-serif; /* Use Montserrat for a modern look */
          font-size: 1.8rem; /* Increase font size */
          font-weight: 700; /* Make it bold */
          color: #007bff; /* Blue color for visibility */
          text-transform: uppercase; /* Uppercase for style */
          letter-spacing: 1.5px; /* Add spacing for a premium look */
        }
   
    .sidebar {
      background: #f8f9fa;
      padding: 20px;
      height: 100vh;
    }
    .search-box {
      margin-bottom: 20px;
    }
    .contractor-card {
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 15px;
      transition: 0.3s;
    }
    .contractor-card:hover {
      transform: translateY(-5px);
    }
    .btn-apply {
      background-color: #007bff;
      color: white;
      border-radius: 5px;
    }
    .status-badge {
        font-size: 0.9rem;
        padding: 5px 10px;
        border-radius: 8px;
        font-weight: bold;
    }
    .pending { background-color: #ffc107; color: black; }
    .approved { background-color: #28a745; color: white; }
    .rejected { background-color: #dc3545; color: white; }
    .withdraw-btn {
        background-color: #ff6f61;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.9rem;
    }
  </style>

<!-- Include Navbar -->

</nav>
  
<div class="section">
    <h2>Work Schedule</h2>
    <table>
        <tr><th>Job</th><th>Venue</th><th>Date</th><th>Contractor</th></tr>
        {% for work in schedule %}
            <tr><td>{{ work.job }}</td><td>{{ work.venue }}</td><td>{{ work.date }}</td><td>{{ work.contractor }}</td></tr>
        {% endfor %}
    </table>
</div>
