{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit {{ contractor.name }}'s Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(145deg, #b0b0b0, #d3d3d3); /* Metallic grey background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .edit-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 700px;
            padding: 30px 40px;
        }

        .edit-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            color: #444;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
        }

        .btn-success {
            background-color: #198754;
            border-color: #198754;
        }

        .btn-secondary:hover {
            background-color: #5c636a;
        }
    </style>
</head>
<body>

<div class="edit-card">
    <div class="edit-title">Edit {{ contractor.name }}'s Profile</div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" name="name" value="{{ contractor.name }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone:</label>
            <input type="text" name="phone" value="{{ contractor.phone }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location:</label>
            <input type="text" name="location" value="{{ contractor.location }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">City:</label>
            <input type="text" name="city" value="{{ contractor.city }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">District:</label>
            <input type="text" name="district" value="{{ contractor.district }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Work Description:</label>
            <textarea name="work_description" class="form-control" rows="4" required>{{ contractor.work_description }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Aadhaar Card:</label>
            <input type="file" name="aadhaar_card" class="form-control">
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button type="submit" class="btn btn-success btn-custom">Save Changes</button>
            <button type="button" onclick="history.back()" class="btn btn-secondary btn-custom">Back</button>
        </div>
    </form>
</div>

</body>
</html>
