{% extends "agent_nav.html" %}
{% block content %}

<div class="container mt-4">
    <h2 class="text-center mb-4">Inactive Workers</h2>
    <div class="row">
        {% for migrant in inactive_migrants %}
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <img src="{{ migrant.photo.url }}" class="card-img-top" alt="Worker Photo" style="height: 200px; object-fit: cover;">
                <div class="card-body text-center">
                    <h5 class="card-title">{{ migrant.full_name }}</h5>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center">
            <p class="text-danger">No inactive workers found.</p>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
