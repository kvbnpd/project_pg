{% extends "dashboard.html" %}
{%block stylecontent1%}
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
    }
    .view-cases-icon {
        display: inline-block;
        margin-bottom: 15px;
        font-size: 1.2em;
        text-decoration: none;
        color: #007bff;
    }
    .view-cases-icon:hover {
        color: #0056b3;
    }

    .container {
        max-width: 500px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    select, input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    button {
        background-color: #28a745;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
    }
    button:hover {
        background-color: #218838;
    }

        .site-name {
          font-family: 'Montserrat', sans-serif; /* Use Montserrat for a modern look */
          font-size: 1.8rem; /* Increase font size */
          font-weight: 700; /* Make it bold */
          color: #007bff; /* Blue color for visibility */
          text-transform: uppercase; /* Uppercase for style */
          letter-spacing: 1.5px; /* Add spacing for a premium look */
        }
   
    .sidebar {
      background: #f8f9fa;
      padding: 20px;
      height: 100vh;
    }
    .search-box {
      margin-bottom: 20px;
    }
    .contractor-card {
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 15px;
      transition: 0.3s;
    }
    .contractor-card:hover {
      transform: translateY(-5px);
    }
    .btn-apply {
      background-color: #007bff;
      color: white;
      border-radius: 5px;
    }
  </style>
{%endblock%}
{%block content1%}
<div class="col-md-9">
    <a href="{%url 'view_all_cases'%}" class="view-cases-icon">
        <i class="fas fa-folder-open"></i> View All Cases
    </a>
    <div class="container">
        <h2>Add Crime Report</h2>
        {% if messages %}
            {% for message in messages %}
                <p style="color: green;">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <label for="firnumber">FIR number:</label>
            <input type="text" name="firnumber" required>
            <label for="migrant">Migrant:</label>
            <select name="migrant" required>
                <option value="">Select Migrant</option>
                {% for migrant in migrants %}
                    <option value="{{ migrant.id }}">{{ migrant.full_name }}</option>
                {% endfor %}
            </select>

            <label for="crime_type">Crime Type:</label>
<select name="crime_type" required>
<option value="">Select Crime Type</option>
<option value="Theft">Theft</option>
<option value="Burglary">Burglary</option>
<option value="Robbery">Robbery</option>
<option value="Pickpocketing">Pickpocketing</option>
<option value="Assault">Assault</option>
<option value="Domestic Violence">Domestic Violence</option>
<option value="Homicide">Homicide</option>
<option value="Kidnapping">Kidnapping</option>
<option value="Fraud">Fraud</option>
<option value="Identity Theft">Identity Theft</option>
<option value="Cybercrime">Cybercrime</option>
<option value="Money Laundering">Money Laundering</option>
<option value="Sexual Harassment">Sexual Harassment</option>
<option value="Rape">Rape</option>
<option value="Human Trafficking">Human Trafficking</option>
<option value="Drug Possession">Drug Possession</option>
<option value="Drug Trafficking">Drug Trafficking</option>
<option value="Substance Abuse">Substance Abuse</option>
<option value="Vandalism">Vandalism</option>
<option value="Trespassing">Trespassing</option>
<option value="Public Disturbance">Public Disturbance</option>
<option value="Hit and Run">Hit and Run</option>
<option value="Drunk Driving">Drunk Driving</option>
<option value="Reckless Driving">Reckless Driving</option>
</select>


            <label for="description">Description:</label>
            <textarea name="description" required></textarea>

            <label for="status">Status:</label>
            <select name="status">
                <option value="Pending">Pending</option>
                <option value="Under Investigation">Under Investigation</option>
                <option value="Resolved">Resolved</option>
            </select>

            <label for="reported_by">Reported By:</label>
            <input type="text" name="reported_by" required>

            <label for="reported_at">Reported At (Police Station):</label>
            <input type="text" name="reported_at" required>

            <button type="submit">Submit Report</button>
        </form>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    var approveModal = document.getElementById("approveModal");
    approveModal.addEventListener("show.bs.modal", function (event) {
        var button = event.relatedTarget;
        var applnId = button.getAttribute("data-id");
        document.getElementById("applnId").value = applnId;
    });

    document.getElementById("approveForm").addEventListener("submit", function (event) {
        event.preventDefault();
        var formData = new FormData(this);
        
        fetch("{% url 'approve_noc' %}", {
            method: "POST",
            body: formData,
            headers: {
                "X-CSRFToken": formData.get("csrfmiddlewaretoken"),
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                alert("NOC Generated Successfully!");
                location.reload();
            } else {
                alert("Error generating NOC");
            }
        });
    });
});

</script>
{%endblock%}
