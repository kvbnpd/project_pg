<!DOCTYPE html>
<html>
<head>
    <title>Form Submitted</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal-content {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
            }
            to {
                transform: translateY(0);
            }
        }

        .checkmark {
            font-size: 60px;
            color: #34a853; /* Google Forms green */
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }

        .ok-btn {
            padding: 12px 24px;
            background-color: #34a853;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .ok-btn:hover {
            background-color: #2e8b47;
        }

        .link-btn {
            margin-top: 10px;
            display: inline-block;
            color: #4285f4;
            text-decoration: none;
            font-size: 14px;
        }

        .link-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Modal Overlay -->
    <div class="modal-overlay">
        <div class="modal-content">
            <div class="checkmark">✅</div>
            <h2>Form Submitted Successfully!</h2>
            <p>Your response has been recorded.</p>
            
            <!-- OK Button to Close/Redirect -->
            <button class="ok-btn" onclick="redirectToHome()">OK</button>

            <!-- Optional Link to Submit Another Response -->
            <br>
            <a href="{% url 'book_job' %}" class="link-btn">Submit another response</a>
        </div>
    </div>

    <!-- JavaScript to Handle Redirect -->
    <script>
        function redirectToHome() {
            window.location.href = "/"; // Redirect to homepage or wherever you like
        }
    </script>
</body>
</html>
