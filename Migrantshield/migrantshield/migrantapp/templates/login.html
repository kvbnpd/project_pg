{% extends "indexnav.html" %}

{% block stylecontent1 %}

{% load static %}

    <style>
        .container1 {
            width: 100%;
            max-width: 800px;
            margin: 100px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .title {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title h2 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }
        
        .title p {
            font-size: 14px;
            color: #666;
        }
        
        form {
            width: 100%;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
        
        .btn:hover {
            background-color: #0056b3;
        }
        
        .link {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .link a {
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
        }
        
        .link a:hover {
            text-decoration: underline;
        }
        
        /* Popup Styles */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.85);
            text-align: center;
            z-index: 1000;
            width: 500px;
            height: 300px;
        }

        .popup .btn-choice {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .popup .btn-choice:hover {
            background-color: #0056b3;
        }
        
        .popup .close-btn {
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
            margin: 10px 0;
            padding: 10px;
            display: block;
            background-color: red;
        }

        /* Error Message Styles */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 5px;
        }

        .alert-danger {
            color: #a94442;
            background-color: #f2dede;
            border-color: #ebccd1;
        }
    </style>

    <section class="single-page-header">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <h2>Sign In </h2>
                    <ol class="breadcrumb header-bradcrumb justify-content-center">
                        <li class="breadcrumb-item"><a href="index.html" class="text-white"></a></li>
                    </ol>
                </div>
            </div>
        </div>
    </section>

    <div class="container1">
        <div class="title">
            <h2>Login</h2>
            <p>Enter your credentials to access your account.</p>
        </div>

        <!-- Display Error Message -->
        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form id="login-form" method="post" action="">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="email" placeholder="Enter Email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="link">
                <p>Don't have an account? <a onclick="openPopup()">Register here</a>.</p>
            </div>
        </form>
    </div>

    <!-- Popup Modal -->
    <div id="registerPopup" class="popup">
        <h2>Register as</h2>
        <a href="http://127.0.0.1:8000/reg" class="btn-choice">Contractor</a>
        <a href="http://127.0.0.1:8000/migrantreg" class="btn-choice">Migrant</a>
        <br>
        <span class="close-btn" onclick="closePopup()">Close</span>
    </div>

    <script>
        function openPopup() {
            document.getElementById("registerPopup").style.display = "block";
        }

        function closePopup() {
            document.getElementById("registerPopup").style.display = "none";
        }
    </script>
{% endblock %}
