{% extends "indexnav.html" %}
{% load crispy_forms_tags %}
{% block stylecontent1 %}
    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        /* Header Section */
        .single-page-header {
            background-color: #007bff;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        /* Form Container */
        .container2 {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: #007bff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select,
        input[type="file"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        select {
            height: 40px;
        }

        .form-actions {
            text-align: center;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

    </style>

    <section class="single-page-header">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <h2>Migrant Worker Registration</h2>
                </div>
            </div>
        </div>
    </section>

    <!-- Migrant Registration Section -->
    <section class="register" id="register">
        <div class="container2">
            <div class="form-container">
                <h2>Create Migrant Worker Account</h2>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Full Name -->
                    <div class="form-group">
                        {{form.as_p}}
                    </div> 

                    <button type="submit">Submit</button>
                </form>
            </div>
        </div>
    </section>
{% endblock %}
