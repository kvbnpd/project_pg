 {% extends "indexnav.html" %}
 {% block content1%}
 <section class="single-page-header">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Register</h2>
                <ol class="breadcrumb header-breadcrumb justify-content-center">
                    <li class="breadcrumb-item"><a href="index.html" class="text-white">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Register</li>
                </ol>
            </div>
        </div>
    </div>
</section>

<section class="registration" id="register">
    <div class="container">
        <div class="row justify-content-center">
            <!-- Section Title -->
            <div class="col-xl-6 col-lg-8">
                <div class="title text-center">
                    <h2>Join Us</h2>
                    <p>Create your account to access exclusive features and opportunities.</p>
                    <div class="border"></div>
                </div>
            </div>
            <!-- /Section Title -->
        </div>
        <div class="row justify-content-center">
            <!-- Registration Form -->
            <div class="registration-form col-md-6">
                <form id="registration-form" method="post" role="form">
                    {% csrf_token %}
                    
                    <div class="form-group mb-4">
                        <label for="name">Full Name</label>
                        <input type="text" placeholder="Enter your full name" class="form-control" name="name" id="name" required>
                    </div>

                    <div class="form-group mb-4">
                        <label for="email">Email Address</label>
                        <input type="email" placeholder="Enter your email" class="form-control" name="email" id="email" required>
                    </div>

                    <div class="form-group mb-4">
                        <label for="phone">Phone Number</label>
                        <input type="text" placeholder="Enter your phone number" class="form-control" name="phone" id="phone" required>
                    </div>

                    <div class="form-group mb-4">
                        <label for="password">Password</label>
                        <input type="password" placeholder="Create a password" class="form-control" name="password" id="password" required>
                    </div>

                    <div class="form-group mb-4">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" placeholder="Confirm your password" class="form-control" name="confirm-password" id="confirm-password" required>
                    </div>

                    <!-- Buttons aligned like the login form -->
                    <div class="d-flex justify-content-between">
                        <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
                        <input type="submit" id="registration-submit" class="btn btn-primary" value="Register">
                    </div>
                </form>
            </div>
            <!-- /End Registration Form -->
        </div> <!-- end row -->
    </div> <!-- end container -->
</section>


 {% endblock%}
